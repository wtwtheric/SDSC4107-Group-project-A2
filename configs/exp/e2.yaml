# E2: Heston d=2, zero cost, risk-preference comparison (paper Figures 6-7).
# A1's validated E1 training recipe is retained; only the CVaR objective changes.
exp: e2
kind: e2
seeds: [0, 1, 2, 3, 4]
device: auto

n_steps: 30
batch: 1024
eps: 0.0

# Primary E2 strategy and the E1 comparison strategy.
alpha: 0.99
compare_alpha: 0.50

policy:
  name: recurrent
  hidden: 17
  recurrent: true
  norm: layer
  out_scale: [1.0, 100.0]

market:
  model: heston
  d: 2
  s0: 100.0
  k: 100.0
  t: 0.08219178082191781   # 30/365
  kappa: 1.0
  theta: 0.04
  sigma: 2.0
  rho: -0.7
  v0: 0.04

train:
  n_iter: 30000
  lr: 0.005
  lr_schedule: cosine
  lr_min: 5.0e-4
  eval_paths: 100000
  eval_seed_offset: 10000
  log_every: 2500
