name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # pfhedge 是 env_heston 的顶层依赖；它要求 numpy<2，而 numpy>=2 的
          # scipy（>=1.18）与之互斥，所以两者按 requirements.lock.txt 钉版本。
          pip install "numpy==1.26.4" "scipy==1.13.1" "pfhedge==0.23.0" matplotlib pytest ruff pyyaml
      - name: CI
        run: python scripts/ci.py
      - name: Diagnose corrected E2cs seed-0 checkpoints (no retraining)
        if: success() && github.ref == 'refs/heads/feat/e2cs-diagnostics'
        run: python -m scripts.diagnose_e2cs --device cpu
      - name: Upload E2cs hedge-shape diagnostics
        if: success() && github.ref == 'refs/heads/feat/e2cs-diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: e2cs-seed0-hedge-shape-diagnostics
          path: |
            reports/e2cs/
            figures/e2cs_diagnostics/
          if-no-files-found: error
      - name: Diagnose E2cs k15 state support, BatchNorm and training
        if: success() && github.ref == 'refs/heads/feat/e2cs-diagnostics'
        run: python -m scripts.diagnose_e2cs_support_bn --n-paths 40000
      - name: Upload E2cs k15 support and BN diagnostics
        if: success() && github.ref == 'refs/heads/feat/e2cs-diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: e2cs-support-bn-training
          path: |
            reports/e2cs/e2cs_support_bn_training.json
            figures/e2cs_diagnostics/e2cs_k15_path_support.png
            figures/e2cs_diagnostics/e2cs_training_cvar.png
          if-no-files-found: error
      - name: Render E4 seed-0 figures and sensitivity tables
        if: success() && github.ref == 'refs/heads/exp/a2-seed0-batch'
        run: python -m scripts.make_figures_a2 --only e4 --seeds 0
      - name: Upload E4 seed-0 figure artifacts
        if: success() && github.ref == 'refs/heads/exp/a2-seed0-batch'
        uses: actions/upload-artifact@v4
        with:
          name: e4-seed0-figures-and-sensitivity
          path: |
            figures/fig10_e4_bs.png
            figures/fig11_e4_heston.png
            reports/e4/
          if-no-files-found: error
